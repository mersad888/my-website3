@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16}}
:root[data-theme="dark"]{--bg:#070b16}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;direction:ltr;width:min(100vw,calc(100vh*2/3));aspect-ratio:2/3;overflow:hidden;background:#000 var(--poster) center/100% 100% no-repeat;isolation:isolate}
.stage>*{position:absolute}
/* yellow light leak drifting over the sunset */
.sun{inset:0;background:radial-gradient(ellipse 55% 38% at 72% 40%,rgba(var(--gold),.55),rgba(var(--gold),0) 70%);mix-blend-mode:screen;animation:sun 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes sun{0%{transform:translate(-6%,4%) scale(.9);opacity:.25}100%{transform:translate(5%,-5%) scale(1.15);opacity:.75}}
/* warm glow from the left light strip */
.warm{inset:0;background:radial-gradient(ellipse 30% 22% at 6% 20%,rgba(var(--gold),.45),transparent 70%);mix-blend-mode:screen;animation:flick 3.4s ease-in-out infinite;pointer-events:none}
@keyframes flick{0%,100%{opacity:.35}45%{opacity:.8}60%{opacity:.5}}
/* second light: cyan glow on the boiler display */
.disp{left:29%;top:41.4%;width:8.4%;height:4.4%;border-radius:6px;background:rgba(var(--cyan),.35);box-shadow:0 0 18px 8px rgba(var(--cyan),.55),0 0 50px 20px rgba(var(--cyan),.25);mix-blend-mode:screen;animation:disp 1.6s ease-in-out infinite;pointer-events:none}
@keyframes disp{0%,100%{opacity:.35}50%{opacity:1}}
/* diagonal shine over the title */
.shine{left:30%;top:12%;width:70%;height:36%;overflow:hidden;pointer-events:none}
.shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:22%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.55),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-30%}100%{left:120%}}
/* Hashem Rafiei: heartbeat */
.name{left:71.8%;top:88%;width:28.2%;height:12%;display:block;border-radius:16px;overflow:hidden;background:var(--poster) 100% 100%/354.3% auto no-repeat;transform-origin:60% 55%;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(var(--gold),.7))}
@keyframes beat{0%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(var(--gold),.5))}12%{transform:scale(1.09);filter:drop-shadow(0 0 18px rgba(var(--gold),1))}24%{transform:scale(1)}36%{transform:scale(1.06);filter:drop-shadow(0 0 14px rgba(var(--gold),.9))}52%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(var(--gold),.5))}}
/* tappable phone + instagram */
.hot{display:block;border-radius:14px;border:2px solid rgba(var(--gold),.9);animation:ring 1.8s ease-out infinite;-webkit-tap-highlight-color:transparent}
.hot:focus-visible,.name:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tel{left:4.2%;top:91.6%;width:34.6%;height:4.8%}
.ig{left:42%;top:92.2%;width:21.4%;height:3%;animation-delay:.6s}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--gold),.65)}70%,100%{box-shadow:0 0 0 14px rgba(var(--gold),0)}}
.stage{container-type:inline-size}
.cta{left:4.2%;top:89%;width:34.6%;height:2.7%;direction:rtl;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#ffe08a,#e0a52a);color:#1a1205;font:800 2.9cqw/1 "Vazirmatn",Tahoma,sans-serif;text-decoration:none;box-shadow:0 0 14px rgba(var(--gold),.8);animation:cta 1.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes cta{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.stage *{animation:none!important}.sun,.warm{opacity:.4}}
.tool{width:13%;aspect-ratio:1;left:0;top:0;opacity:0;pointer-events:none;color:#ffe08a;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(var(--gold),.95)) drop-shadow(0 0 2px #000);will-change:transform,opacity}
.caseglow{left:14%;top:60.5%;width:25%;height:11%;background:radial-gradient(ellipse at 50% 40%,rgba(var(--gold),.85),rgba(var(--gold),0) 68%);mix-blend-mode:screen;opacity:0;pointer-events:none}
.tool.real{filter:drop-shadow(0 2px 3px rgba(0,0,0,.75)) drop-shadow(0 0 7px rgba(var(--gold),.7))}
.tool{filter:drop-shadow(0 2px 3px rgba(0,0,0,.75)) drop-shadow(0 0 7px rgba(var(--gold),.7))}
</style>

<script>
(function(){
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var tools=[].slice.call(document.querySelectorAll('.tool')),glow=document.querySelector('.caseglow');
var T={x:35.5,y:64},S=[{sx:6,sy:16,cx:5,cy:54},{sx:44,sy:13,cx:50,cy:42},{sx:9,sy:48,cx:0,cy:62},{sx:47,sy:47,cx:54,cy:64},{sx:27,sy:7,cx:52,cy:28}];
var LOOP=12,FLY=2.4,GAP=1.15,START=0.6;
function frame(ts){
var t=(ts/1000)%LOOP,g=0;

});

}
